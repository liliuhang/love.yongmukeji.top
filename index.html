            function parseLRC(lrcStr){
                if(!lrcStr) return [];
                const lines = lrcStr.split(/\r?\n/);
                const result = [];
                const reg = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\](.*)/;
                for(let line of lines){
                    const match = line.match(reg);
                    if(!match) continue;
                    const min = Number(match[1]);
                    const sec = Number(match[2]);
                    const ms = Number(match[3]||0);
                    const text = match[4].trim();
                    const time = min*60 + sec + ms / 1000;
                    result.push({time,text});
                }
                return result.sort((a,b)=>a.time-b.time);
            }

            async function loadLrcFile(url){
                try{
                    const resp = await fetch(url, {cache:"no-cache"});
                    if(!resp.ok) throw new Error("lrc文件读取失败");

                    return parseLRC(text);
                }catch(err){
                    console.warn("加载外部歌词失败：",err);
                    return null;
                }
            }

            function renderLyrics(list){
                lyricScrollBox.innerHTML = "";
                activeLyricIndex = -1;
                if(!list || list.length === 0){
                    lyricScrollBox.innerHTML = `<div class="lyric-tip">🛑加载歌词失败</div>`;
                    lyricArr = [];
                    return;
                }
                lyricArr = list;
                lyricArr.forEach((item,idx)=>{
                    const div = document.createElement('div');
                    div.className = "lyric-line";
                    div.innerText = item.text;
                    div.dataset.index = idx;
                    if(/(词|曲|编曲|制作人|主唱|钢琴|古筝|贝斯|吉他|笛子|录音师|混音|母带|监制|版权|OP|SP|出品人)/.test(item.text)){
                        div.classList.add('meta-row');
                    }
                    lyricScrollBox.appendChild(div);
                })
            }

            function updateLyricByTime(currentSec){
                if(!lyricArr || lyricArr.length === 0) return;
                let findIdx = 0;
                for(let i=0;i<lyricArr.length;i++){
                    if(lyricArr[i].time <= currentSec){
                        findIdx = i;
                    }else break;
                }
                if(findIdx === activeLyricIndex) return;
                activeLyricIndex = findIdx;

                const allLines = lyricScrollBox.querySelectorAll('.lyric-line');
                allLines.forEach(el=>el.classList.remove('active'));
                const activeDom = allLines[activeLyricIndex];
                if(!activeDom) return;
                activeDom.classList.add('active');

                const panelHeight = lyricPanel.clientHeight;
                const lineTop = activeDom.offsetTop;
                const lineHeight = activeDom.offsetHeight;
                const targetTranslateY =  panelHeight / 2 - (lineTop + lineHeight / 2);

                const scrollBoxHeight = lyricScrollBox.scrollHeight;
                const maxPositive = 0;
                const minTranslate = -(scrollBoxHeight - panelHeight);
                let finalOffset = targetTranslateY;
                if(finalOffset > maxPositive) finalOffset = maxPositive;
                if(finalOffset < minTranslate) finalOffset = minTranslate;

                lyricScrollBox.style.transform = `translateY(${finalOffset}px)`;
            }

            function formatTime(sec){
                if(isNaN(sec)) return "00:00";
                const m = Math.floor(sec /60).toString().padStart(2,'0');
                const s = Math.floor(sec %60).toString().padStart(2,'0');
                return `${m}:${s}`;
            }

            async function refreshPlayerUi(){
                const song = songList[currentSongIndex];
                songCover.src = song.coverUrl;
                songName.innerText = song.name;
                songSinger.innerText = song.singer;
                bgMusic.pause();
                bgMusic.currentTime = 0;
                isPlaying = false;
                syncPlayBtn();
                bgMusic.src = song.audioUrl;
                bgMusic.load();
                lyricScrollBox.innerHTML = `<div class="lyric-tip">歌词加载中…</div>`;

                let lrcData = null;
                if(USE_EXTERNAL_LRC){
                    lrcData = await loadLrcFile(song.lrcUrl);
                }else{
                    lrcData = parseLRC(song.lrcInner);
                }
                renderLyrics(lrcData);
            }

            function playPrevSong(){
                const wasPlaying = isPlaying;
                currentSongIndex = (currentSongIndex - 1 + songList.length) % songList.length;
                refreshPlayerUi().then(()=>{
                    if(wasPlaying){
                        bgMusic.play().catch(e=>console.log("上一首播放异常",e));
                    }
                });
            }
            function playNextSong(){
                const wasPlaying = isPlaying;
                currentSongIndex = (currentSongIndex + 1) % songList.length;
                refreshPlayerUi().then(()=>{
                    if(wasPlaying){
                        bgMusic.play().catch(e=>console.log("下一首播放异常",e));
                    }
                });
            }

            function syncPlayBtn(){
                playToggleBtn.innerText = isPlaying ? "⏸" : "▶";
            }

            function unlockAudioCore(){
                if(audioUnlocked) return;
                audioUnlocked = true;
                bgMusic.muted = false;
            }

            closeModalBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                tipModal.style.display = 'none';
                unlockAudioCore();
            });

            playToggleBtn.addEventListener('click',async (e)=>{
                e.preventDefault();
                unlockAudioCore();
                try{
                    if(isPlaying){
                        bgMusic.pause();
                        isPlaying = false;
                    }else{
                        await bgMusic.play();
                        isPlaying = true;
                    }
                    syncPlayBtn();
                }catch(err){
                    console.log("播放异常：",err);
                }
            })
            prevBtn.addEventListener('click',playPrevSong);
            nextBtn.addEventListener('click',playNextSong);

            function getProgressPercentByEvent(evt){
                const rect = progressBg.getBoundingClientRect();
                let clientX;
                if(evt.touches && evt.touches.length>0){
                    clientX = evt.touches[0].clientX;
                }else{
                    clientX = evt.clientX;
                }
                let percent = (clientX - rect.left) / rect.width;
                percent = Math.max(0,Math.min(1,percent));
                return percent;
            }
            function seekAudioByPercent(percent){
                if(isNaN(bgMusic.duration)) return;
                bgMusic.currentTime = percent * bgMusic.duration;
                updateLyricByTime(bgMusic.currentTime);
            }
            progressWrap.addEventListener('mousedown',(e)=>{
                isDraggingProgress = true;
                seekAudioByPercent(getProgressPercentByEvent(e));
            });
            document.addEventListener('mousemove',(e)=>{
                if(!isDraggingProgress) return;
                seekAudioByPercent(getProgressPercentByEvent(e));
            });
            document.addEventListener('mouseup',()=>{
                isDraggingProgress = false;
            });
            progressWrap.addEventListener('touchstart',(e)=>{
                isDraggingProgress = true;
                seekAudioByPercent(getProgressPercentByEvent(e));
            },{passive:true});
            document.addEventListener('touchmove',(e)=>{
                if(!isDraggingProgress) return;
                seekAudioByPercent(getProgressPercentByEvent(e));
            },{passive:true});
            document.addEventListener('touchend',()=>{
                isDraggingProgress = false;
            });

            bgMusic.addEventListener('timeupdate',()=>{
                if(isDraggingProgress) return; //拖拽期间不更新进度条
                const cur = bgMusic.currentTime;
                const total = bgMusic.duration;
                if(!isNaN(total)){
                    const pct = (cur/total)*100;
                    progressFill.style.width = `${pct}%`;
                    currentTimeTxt.innerText = formatTime(cur);
                    totalTimeTxt.innerText = formatTime(total);
                }
                updateLyricByTime(cur);
            })

            bgMusic.addEventListener('ended',()=>{
                playNextSong();
            })

            bgMusic.addEventListener('play',()=>{
                isPlaying = true;
                syncPlayBtn();
            })
            bgMusic.addEventListener('pause',()=>{
                isPlaying = false;
                syncPlayBtn();
            })

            if(navigator.userAgent.toLowerCase().includes('micromessenger')){
                document.addEventListener('WeixinJSBridgeReady', ()=>{
                    unlockAudioCore();
                }, false);
            }

            refreshPlayerUi();
            syncPlayBtn();

            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 25 : 35;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 8 + 4 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 7) + 's';
                particlesContainer.appendChild(particle);
            }
        })
    </script>
</body>
</html>
