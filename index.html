<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面已升级-正在重定向</title>
    <link rel="icon" href="https://hive.forms.usercontent.microsoft/Images/9188040d-6c67-4c5b-b112-36a304b66dad/00000000-0000-0000-0003-bffd409131bf/T0RRH45M4BJGVXSCOEE2GS5JAZ/fe1565ec-02bf-4b26-800f-b6b659adee28" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-left-color: #fff;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: normal;
        }
        .desc {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 8px;
        }
        .count {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2 class="title">该网页已升级</h2>
    <p class="desc">正在为您自动重定向到最新页面...</p>
    <p class="count" id="count">3 秒后跳转</p>
    <script>
        // 弹出提示框
        alert(`该网页目前已迁移至我司分配给个人使用的二级域名liliuhang.yongmukeji.top下，即日起此域名不再向个人提供，点击确定后将为您跳转！
【⚠️二级域名liliuhang.yongmukeji.top及其下属的其它多级域名所展示的内容不代表我司立场，我司仅为所展示内容的合法合规性（不违反法律法规、公序良俗等）负责！】`);

        // 自动跳转目标地址
        const targetUrl = "https://love.liliuhang.yongmukeji.top";
        let count = 3;
        const countEl = document.getElementById("count");
        // 倒计时
        const timer = setInterval(() => {
            count--;
            countEl.textContent = count + " 秒后跳转";
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 3000);
    </script>
</body>
</html>
